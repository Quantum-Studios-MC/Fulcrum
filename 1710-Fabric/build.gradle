// Adjust the output jar name here
archivesBaseName = "${mod_name}-Fabric-1.7.10"

dependencies {
	// Add your own dependencies here

	// Fabric API. Can be removed if not needed
	modImplementation "maven.modrinth:legacy-fabric-api:${fabric_api}"

	// Do not remove or edit!
	implementation(project(":Common"))
}

// Maven Publishing. Remove if not needed
publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId base.archivesName.get()
			from components.java
		}
	}
	repositories {
		// Add your maven repository here
		maven {
			url "file://" + System.getenv("local_maven")
		}
	}
}

/**
 * ===============================================================================
 * =       DO NOT EDIT BELOW THIS LINE UNLESS YOU KNOW WHAT YOU ARE DOING        =
 * ===============================================================================
 */

unimined.minecraft {
	mappings {
		searge()
		mcp("stable", "12-1.7.10")
	}

	legacyFabric {
		loader fabric_loader
	}

	runs {
		config("client") {
			javaVersion = JavaVersion.VERSION_17
		}
		config("server") {
			javaVersion = JavaVersion.VERSION_17
		}
	}

	defaultRemapJar = true
}

tasks.named("spotbugsMain") {
	enabled = false
}

processResources {
	from project(":Common").sourceSets.main.resources
	def buildProps = project.properties.clone()

	filesMatching(['fabric.mod.json']) {
		expand buildProps
	}
}

compileTestJava.enabled = false

tasks.withType(JavaCompile).configureEach {
	source(project(":Common").sourceSets.main.allSource)
}
