// Adjust the output jar name here
archivesBaseName = "${mod_name}-Cleanroom-1.12.2"

dependencies {
	implementation project(":Common")
}

// Maven Publishing. Remove if not needed
publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId base.archivesName.get()
			from components.java
		}
	}
	repositories {
		// Add your maven repository here
		maven {
			url "file://" + System.getenv("local_maven")
		}
	}
}

/**
 * ===============================================================================
 * =       DO NOT EDIT BELOW THIS LINE UNLESS YOU KNOW WHAT YOU ARE DOING        =
 * ===============================================================================
 */

unimined.minecraft {
	mappings {
		mcp("stable", "39-1.12")
	}

	cleanroom {
		loader "0.3.0-alpha"
	}
	defaultRemapJar = true
}

tasks.register("generateJson") {
	group = "data"
	description = "Generates item model JSONs from Java classes."

	doLast {
		javaexec {
			mainClass = "fulcrum.cleanroom1122.gen.Generator"
			classpath = sourceSets.main.runtimeClasspath
		}
	}
}

tasks.named("build") {
	dependsOn("generateJson")
}

tasks.named("runClient") {
	dependsOn("generateJson")
}

tasks.named("spotbugsMain") {
	enabled = false
}

processResources {
	from project(":Common").sourceSets.main.resources
}

compileTestJava.enabled = false

tasks.withType(JavaCompile).configureEach {
	source(project(":Common").sourceSets.main.allSource)
}
